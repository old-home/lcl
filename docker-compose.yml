services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - "./.docker/web/etc/:/etc/nginx"
      - "./backend:/app"
    ports:
      - ":${WEB_PORT:-80}:${WEB_INTERNAL_PORT:-80}"
  app:
    build: .docker/app/
    volumes:
      - "./backend:/app"
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${DB_USERNAME} -d $${DB_DATABASE} || exit 1" ]
      interval: 1s
      timeout: 30s
      retries: 30
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
  cache:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - redis_data:/data
  docs:
    image: mongo:latest
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo docs:27017/lcl --quiet
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  redis_data:
  mongo_data:
